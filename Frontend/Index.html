     </div>
      <section id="map-panel" data-dashboard-view="map" class="canva-section soft-card dashboard-map-panel hidden-view">
       <div class="mb-5"><p class="dashboard-kicker">Explore</p><h2 id="map-title" class="display-font text-3xl">Destination map</h2></div>
       <div class="relative overflow-hidden rounded-xl bg-[#dff5f3]">
        <div id="trip-map" class="trip-map" aria-label="Interactive destination map"></div>
        <p id="map-label" class="pointer-events-none absolute bottom-3 left-4 z-[500] rounded-full bg-white/90 px-3 py-1 text-xs font-bold shadow-sm"></p>
        <button id="map-refresh" class="map-refresh" type="button" title="Refresh map" aria-label="Refresh map"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
       </div>
      </section>
      <section id="visual-section" data-template-id="visual-section" data-dashboard-view="places" class="visual-section rounded-3xl bg-[#173d46] p-5 text-white sm:p-7">
       <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-end">
        <div>
         <p data-template-id="visual-kicker" class="canva-text text-xs font-bold uppercase tracking-[.18em] text-[#f5c96a]">
</p>
         <h2 data-template-id="visual-title" class="canva-text display-font mt-1 text-3xl">
</h2>
        </div>
        <i data-lucide="camera" class="h-6 w-6 text-[#f5c96a]">
</i>
       </div>
       <div id="visual-gallery" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
</div>
      </section>
        <section data-template-id="celebration-section" data-dashboard-view="places" class="celebration-section rounded-3xl border border-[#f2d6ad] bg-[#fff8ed] p-5 sm:p-7">
       <div class="flex items-start justify-between gap-4">
        <div>
         <p data-template-id="celebration-kicker" class="canva-text text-xs font-bold uppercase tracking-[.18em] text-[#c76646]">
</p>
         <h2 data-template-id="celebration-title" class="canva-text display-font mt-1 text-3xl">
</h2>
         <p id="celebration-description" class="mt-2 max-w-2xl text-sm leading-relaxed text-[#6b5a4b]">
</p>
        </div>
        <i data-lucide="party-popper" class="h-6 w-6 shrink-0 text-[#e97857]">
</i>
       </div>
       <div id="celebration-list" class="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-3">
</div>
      </section>
    </section>
        <section id="trip-assistant" class="trip-assistant mt-12 rounded-3xl bg-[#173d46] p-5 text-white sm:p-7">
         <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-start">
          <div>
           <p data-template-id="assistant-kicker" class="canva-text text-xs font-bold uppercase tracking-[.18em] text-[#f5c96a]"></p>
           <h2 data-template-id="assistant-title" class="canva-text display-font mt-1 text-3xl"></h2>
           <p data-template-id="assistant-description" class="canva-text mt-2 max-w-2xl text-sm leading-relaxed text-white/75"></p>
          </div>
          <i data-lucide="messages-square" class="h-7 w-7 shrink-0 text-[#9be6df]"></i>
         </div>
         <div id="assistant-messages" class="assistant-messages mt-6 space-y-3" aria-live="polite"></div>
         <form id="assistant-form" class="mt-5 flex flex-col gap-3 sm:flex-row">
          <label class="sr-only" for="assistant-input">Ask the trip assistant</label>
          <input id="assistant-input" class="field-control flex-1" type="text" placeholder="Try: trips under 30000 INR for food and culture" autocomplete="off">
          <button class="canva-button flex items-center justify-center gap-2 rounded-xl px-5 py-3 font-bold" type="submit">
           <i data-lucide="send" class="h-4 w-4"></i>
           <span data-template-id="assistant-submit"></span>
          </button>
         </form>
         <p id="assistant-status" class="mt-3 min-h-5 text-sm text-[#f5c96a]" aria-live="polite"></p>
        </section>
    <section class="mt-12">
     <div class="mb-5 flex items-end justify-between gap-4">
      <div>
       <p data-template-id="saved-kicker" class="canva-text text-xs font-bold uppercase tracking-[.18em]">
</p>
       <h2 data-template-id="saved-title" class="canva-text display-font mt-1 text-3xl">
</h2>
      </div>
<span id="saved-count" class="rounded-full bg-[#dff5f3] px-3 py-1 text-sm font-bold text-[#075968]">0</span>
     </div>
     <div id="saved-empty" data-template-id="saved-empty" class="canva-banner rounded-2xl border border-dashed border-[#b8c9cd] px-5 py-8 text-center">
</div>
     <div id="saved-plans-list" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
</div>
    </section>
   </div>
  </main>
  <template id="day-template">
   <article data-template-id="day-card" class="canva-card reveal rounded-2xl border border-[#e2eaeb] p-4">
                <img class="day-image" loading="lazy">
    <div class="flex gap-4">
     <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#dff5f3] font-bold text-[#007c91]">
      <span class="day-number">
</span>
     </div>
     <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-baseline justify-between gap-2">
       <h3 class="day-title font-bold">
</h3>
<span class="day-date text-xs font-semibold text-[#65808a]">
</span>
      </div>
      <div class="day-activities mt-3 space-y-2">
</div>
     </div>
    </div>
   </article>
  </template>
  <template id="activity-template">
   <div class="flex items-start gap-3 text-sm">
<span class="activity-time w-16 shrink-0 font-bold text-[#007c91]">
</span> <span class="activity-text leading-relaxed">
</span>
   </div>
  </template>
  <template id="budget-row-template">
   <div>
    <div class="mb-1 flex justify-between text-sm">
    <span class="budget-name text-white/80">
</span>
<span class="budget-value font-bold">
</span>
    </div>
      <p class="budget-person-value mb-1 text-xs text-white/55">
</p>
    <div class="h-1.5 overflow-hidden rounded-full bg-white/15">
     <div class="budget-bar h-full rounded-full bg-[#9be6df]">
</div>
    </div>
   </div>
  </template>
  <template id="list-item-template">
   <li class="flex items-start gap-2">
<i data-lucide="check" class="mt-0.5 h-4 w-4 shrink-0 text-[#007c91]">
</i>
<span class="list-item-text">
</span>
</li>
  </template>
  <template id="packing-item-template">
<label class="check-item flex cursor-pointer items-center gap-3 rounded-xl border border-[#e3ebea] px-3 py-2.5 transition hover:border-[#8bcfcb]"> <input class="h-4 w-4 accent-[#007c91]" type="checkbox"> <span class="packing-item-text flex-1 text-sm">
</span> <i data-lucide="check-circle-2" class="h-4 w-4 text-[#b4c4c8]">
</i> </label>
  </template>
  <template id="saved-plan-template">
   <article data-template-id="saved-plan-card" class="canva-card saved-card rounded-2xl bg-white p-5">
    <div class="flex items-start justify-between gap-3">
     <div>
      <p class="saved-destination display-font text-2xl">
</p>
      <p class="saved-dates mt-1 text-sm text-[#58717b]">
</p>
     </div>
<i data-lucide="map-pinned" class="h-5 w-5 text-[#f1765d]">
</i>
    </div>
    <div class="mt-4 flex items-center justify-between border-t border-[#e7eeee] pt-4 text-sm">
<span class="saved-budget font-semibold">
</span> <span class="saved-mode rounded-full bg-[#dff5f3] px-3 py-1 text-xs font-bold text-[#075968]">
</span>
    </div>
    <div class="mt-4 flex gap-2">
<button data-template-id="load-plan-button" class="canva-button load-plan flex-1 rounded-xl px-3 py-2 text-sm font-bold" type="button">
</button> <button data-template-id="delete-plan-button" class="canva-button delete-plan rounded-xl border border-[#f0b4a8] px-3 py-2 text-sm font-bold" type="button">
</button>
    </div>
    <div class="delete-confirm hidden-view mt-3 rounded-xl bg-[#fff2ef] p-3">
     <p data-template-id="delete-confirm-copy" class="canva-text text-sm font-semibold">
</p>
     <div class="mt-2 flex gap-2">
<button data-template-id="confirm-delete-button" class="canva-button confirm-delete rounded-lg px-3 py-1.5 text-xs font-bold" type="button">
</button> <button data-template-id="cancel-delete-button" class="canva-button cancel-delete rounded-lg px-3 py-1.5 text-xs font-bold" type="button">
</button>
     </div>
    </div>
   </article>
  </template>
  <script src="script.js">
</script>
 </body>
</html>
